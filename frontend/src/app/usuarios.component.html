<section>
  <h2>Gestión de usuarios</h2>

  <!-- ngSubmit ejecuta guardar() cuando el formulario se envía. -->
  <form #formUsuario="ngForm" (ngSubmit)="guardar()">
    <fieldset [disabled]="guardando()">
      <legend>
        {{ idEdicion ? 'Editar usuario' : 'Registrar usuario' }}
      </legend>

      <div class="campo">
        <label for="usuarioNombre">Nombre</label>
        <input id="usuarioNombre" name="nombre" [(ngModel)]="formulario.nombre" required />
      </div>

      <div class="campo">
        <label for="usuarioCorreo">Correo</label>
        <input
          id="usuarioCorreo"
          name="correo"
          type="email"
          [(ngModel)]="formulario.correo"
          required
          email
        />
      </div>

      <div class="botones">
        <button type="submit" [disabled]="formUsuario.invalid">
          {{ guardando() ? 'Guardando...' : idEdicion ? 'Actualizar' : 'Registrar' }}
        </button>
        <button type="button" class="secundario" (click)="cancelar()">Cancelar</button>
      </div>
    </fieldset>
  </form>

  <p role="status">{{ mensaje() }}</p>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <!-- @for repite una fila por cada usuario. -->
      @for (usuario of usuarios(); track usuario._id) {
        <tr>
          <td>{{ usuario.nombre }}</td>
          <td>{{ usuario.correo }}</td>
          <td>
            <button type="button" [disabled]="guardando()" (click)="editar(usuario)">Editar</button>

            <button type="button" [disabled]="guardando()" (click)="eliminar(usuario)">
              Eliminar
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3">No hay usuarios registrados.</td>
        </tr>
      }
    </tbody>
  </table>
</section>
